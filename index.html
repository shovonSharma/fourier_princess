<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07050c">
<title>A gift for Sneha</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Josefin+Sans:wght@600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#07050c;overscroll-behavior:none}
body{height:100dvh;touch-action:none;position:relative}
html{padding-top:env(safe-area-inset-top,0px)}
.glow{position:fixed;width:130vmax;height:130vmax;left:50%;top:50%;margin:-65vmax 0 0 -65vmax;pointer-events:none;opacity:.55;transition:opacity 3s ease;will-change:transform}
.g1{background:radial-gradient(circle,rgba(255,45,117,.5),transparent 38%);transform:translate(-30vmax,-26vmax);animation:d1 26s ease-in-out infinite alternate}
.g2{background:radial-gradient(circle,rgba(255,150,40,.42),transparent 36%);transform:translate(28vmax,30vmax);animation:d2 32s ease-in-out infinite alternate}
.g3{background:radial-gradient(circle,rgba(110,70,255,.38),transparent 34%);transform:translate(20vmax,-24vmax);animation:d3 38s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(-10vmax,-4vmax)}}@keyframes d2{to{transform:translate(8vmax,6vmax)}}@keyframes d3{to{transform:translate(2vmax,-6vmax)}}
body.party .glow{opacity:1}
.vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 42%,transparent 40%,rgba(4,2,8,.75) 100%)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#c{transition:opacity 2.8s ease}#c.dim{opacity:.22}#fx{pointer-events:none}
#photo{position:fixed;display:block;pointer-events:none;opacity:0;transform:scale(1.05);transition:opacity 2.8s ease,transform 3.4s cubic-bezier(.2,.7,.2,1);
-webkit-mask-image:radial-gradient(ellipse closest-side at 50% 47%,#000 62%,transparent 100%);mask-image:radial-gradient(ellipse closest-side at 50% 47%,#000 62%,transparent 100%)}
#photo.on{opacity:1;transform:none}
#ui{position:fixed;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;gap:16px;padding:0 14px calc(env(safe-area-inset-bottom,0px) + 22px);text-align:center}
#msg{margin:0;font-weight:400;display:flex;flex-direction:column;align-items:center;gap:6px}
.hb{font:600 clamp(14px,4.3vw,24px)/1 'Josefin Sans',system-ui,sans-serif;letter-spacing:.3em;white-space:nowrap;color:#ffd9e6;padding-left:.3em}
.nm{font:400 clamp(38px,12.6vw,84px)/1.1 'Abril Fatface',Georgia,serif;color:#fff4d6;text-shadow:0 0 18px rgba(255,79,139,.85),0 0 46px rgba(255,150,40,.55)}
.w{display:inline-block;white-space:nowrap}
.l{display:inline-block;opacity:0;transform:translateY(34px) scale(.5) rotate(-8deg)}
#msg.on .l{animation:pop .9s cubic-bezier(.2,1.5,.4,1) forwards;animation-delay:calc(var(--i)*80ms)}
@keyframes pop{to{opacity:1;transform:none}}
#rp{font:600 16px/1 'Josefin Sans',system-ui,sans-serif;letter-spacing:.2em;color:#fff;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.55);border-radius:999px;min-height:46px;padding:0 28px 0 30px;opacity:0;pointer-events:none;transition:opacity 1s ease}
#rp.on{opacity:1;pointer-events:auto}#rp:active{background:rgba(255,255,255,.25)}
#sw{position:fixed;z-index:5;display:none;align-items:center;gap:10px;right:14px;top:calc(env(safe-area-inset-top,0px) + 12px);padding:0 6px 0 14px;min-height:40px;border-radius:999px;border:1.5px solid rgba(255,255,255,.4);background:rgba(255,255,255,.08);color:#fff;font:600 12px/1 'Josefin Sans',system-ui,sans-serif;letter-spacing:.2em;cursor:pointer}
#sw i{position:relative;width:42px;height:24px;border-radius:999px;background:rgba(255,255,255,.25);transition:background .25s}
#sw i::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .25s}
#sw[aria-checked=true] i{background:linear-gradient(90deg,#ff5a8f,#ffb04a)}
#sw[aria-checked=true] i::after{transform:translateX(18px)}
/* ---------- front page ---------- */
#gate{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(20px,5vh,40px);border:0;margin:0;padding:24px;cursor:pointer;overflow:hidden;
background:radial-gradient(ellipse at 50% 40%,#43174f,#07050c 72%);transition:opacity 1.1s ease}
#gate.gone{opacity:0;pointer-events:none}
#gate b{font:400 clamp(38px,12vw,72px)/1.08 'Abril Fatface',Georgia,serif;color:#fff4d6;text-align:center;text-shadow:0 0 18px rgba(255,79,139,.85),0 0 46px rgba(255,150,40,.55);transition:opacity .5s}
#gate span{font:600 15px/1 'Josefin Sans',system-ui,sans-serif;letter-spacing:.3em;color:#ffd9e6;border:1.5px solid rgba(255,255,255,.55);border-radius:999px;padding:16px 30px 16px 33px;animation:pulse 2.2s ease-in-out infinite;transition:opacity .4s}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(255,150,190,.12);border-color:#fff}}
#gate.open b,#gate.open span{opacity:0}
#bx{position:relative;width:min(62vw,250px);aspect-ratio:240/260;animation:bob 3.4s ease-in-out infinite}
#bx svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 18px 30px rgba(255,60,120,.35))}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-10px) rotate(1.5deg)}}
#gate.open #bx{animation:none}
#lid{transform-box:fill-box;transform-origin:50% 100%;transition:transform .9s cubic-bezier(.3,1.5,.5,1),opacity .5s ease .55s}
#gate.open #lid{transform:translateY(-140px) rotate(-18deg);opacity:0}
#burst{position:absolute;left:50%;top:46%;width:24px;height:24px;margin:-12px;border-radius:50%;pointer-events:none;transform:scale(0);opacity:0;background:radial-gradient(circle,#fff 0,#ffe2a8 30%,#ff8fb8 55%,transparent 72%)}
#gate.open #burst{opacity:1;transform:scale(70);transition:transform 1.3s cubic-bezier(.5,0,.8,.4) .35s,opacity .2s .35s}
.sp{position:absolute;left:var(--x);top:var(--y);width:var(--s);height:var(--s);background:#ffe9b8;clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);animation:tw 2.6s ease-in-out infinite;animation-delay:var(--d);opacity:0}
@keyframes tw{0%,100%{opacity:0;transform:scale(.3) rotate(0)}50%{opacity:1;transform:scale(1) rotate(40deg)}}
@media (prefers-reduced-motion:reduce){#bx,#gate span,.sp{animation:none}.sp{opacity:.8}}
</style></head><body>

  sc=Math.min(cw*0.94/BW,(ch-top)*0.63/BH);ox=cw/2;oy=top+(ch-top)*0.385;
  g.setTransform(dpr,0,0,dpr,0,0);grad=g.createLinearGradient(0,oy-BH*sc/2,0,oy+BH*sc/2);addStops(grad);
  photo.style.left=(ox+(RX-CX)*sc)+'px';photo.style.top=(oy+(RY-CY)*sc)+'px';photo.style.width=(IW*sc)+'px';photo.style.height=(IH*sc)+'px';
  buildArt();
}
function tip(tau,o,i){var x=0,y=0;for(var k=0;k<K;k++){var a=D[k*3+1],b=D[k*3+2],t=TAU*D[k*3]*tau,c=Math.cos(t),s=Math.sin(t);x+=a*c-b*s;y+=a*s+b*c}o[i]=x;o[i+1]=y}
function pt(i){return [ox+trail[i*2]*sc,oy+trail[i*2+1]*sc]}
function drawTrail(n,alpha,comet){
  if(n<2||alpha<=0)return;
  var p1=new Path2D(),p2=new Path2D(),i,q,c;
  for(i=0;i<n;i++){q=pt(i);c=conn[i];var P=c?p2:p1;
    if(i===0)P.moveTo(q[0],q[1]);else{if(c!==conn[i-1]){var r=pt(i-1);P.moveTo(r[0],r[1])}P.lineTo(q[0],q[1])}}
  g.lineJoin=g.lineCap="round";g.strokeStyle=grad;
  g.globalAlpha=alpha*.2;g.lineWidth=8;g.stroke(p1);
  g.globalAlpha=alpha;g.lineWidth=1.6;g.stroke(p1);
  g.globalAlpha=alpha*.28;g.lineWidth=.9;g.stroke(p2);
  if(comet){var h=new Path2D(),f=Math.max(0,n-80);q=pt(f);h.moveTo(q[0],q[1]);for(i=f+1;i<n;i++){q=pt(i);h.lineTo(q[0],q[1])}
    g.strokeStyle="#fff";g.globalAlpha=.85;g.lineWidth=2.6;g.stroke(h)}
}
function circles(tau,alpha,o){
  if(alpha<=0)return;var x=0,y=0;g.lineWidth=1;g.strokeStyle="#8eeaff";
  for(var k=0;k<M;k++){
    var a=D[k*3+1],b=D[k*3+2],t=TAU*D[k*3]*tau,c=Math.cos(t),s=Math.sin(t),dx=a*c-b*s,dy=a*s+b*c,r=Math.hypot(a,b)*sc;
    if(r>1.2){g.globalAlpha=alpha*.3;g.beginPath();g.arc(ox+x*sc,oy+y*sc,r,0,TAU);g.stroke()}
    g.globalAlpha=alpha*.8;g.beginPath();g.moveTo(ox+x*sc,oy+y*sc);g.lineTo(ox+(x+dx)*sc,oy+(y+dy)*sc);g.stroke();x+=dx;y+=dy}
  g.globalAlpha=alpha*.35;g.beginPath();g.moveTo(ox+x*sc,oy+y*sc);g.lineTo(ox+o[0]*sc,oy+o[1]*sc);g.stroke();
  var X=ox+o[0]*sc,Y=oy+o[1]*sc;g.fillStyle="#ff5a8f";g.globalAlpha=alpha*.3;g.beginPath();g.arc(X,Y,11,0,TAU);g.fill();
  g.fillStyle="#fff";g.globalAlpha=alpha;g.beginPath();g.arc(X,Y,4.2,0,TAU);g.fill();
}
function render(tau,ca,ta,ka,comet){
  g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,cw,ch);
  var h=[0,0];if(ca>0)tip(tau,h,0);
  drawTrail(cnt,ta,comet);
  if(ka>0){g.setTransform(1,0,0,1,0,0);g.globalAlpha=ka;g.drawImage(art,0,0);g.setTransform(dpr,0,0,dpr,0,0)}
  circles(tau,ca,h);g.globalAlpha=1;
}
var COLS=["#ffd36b","#ff4f8b","#fff4d6","#7ae7ff","#a97bff","#ff9d2e"];
function boom(x,y){var c=COLS[(Math.random()*6)|0],c2=COLS[(Math.random()*6)|0];
  for(var i=0;i<54;i++){var a=Math.random()*TAU,v=1.6+Math.random()*4;parts.push({k:0,x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1,d:.01+Math.random()*.01,c:i%3?c:c2})}}
function celebrate(now){
  document.body.classList.add("party");
  for(var i=0;i<130;i++)parts.push({k:1,x:Math.random()*cw,y:-20-Math.random()*ch*.5,vx:(Math.random()-.5)*1.6,vy:2+Math.random()*3,r:Math.random()*TAU,vr:(Math.random()-.5)*.3,w:5+Math.random()*6,l:1,c:COLS[(Math.random()*6)|0]});
  for(var j=0;j<9;j++)bursts.push({t:now+j*480,x:cw*(.15+Math.random()*.7),y:ch*(.1+Math.random()*.4)});
  timers.push(setTimeout(function(){msg.classList.add("on")},600));
  timers.push(setTimeout(function(){rp.classList.add("on")},4200));
}
function fxStep(now,dt){
  fg.setTransform(dpr,0,0,dpr,0,0);fg.clearRect(0,0,cw,ch);
  for(var b=bursts.length-1;b>=0;b--)if(now>=bursts[b].t){boom(bursts[b].x,bursts[b].y);bursts.splice(b,1)}
  for(var i=parts.length-1;i>=0;i--){var p=parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;
    if(p.k===0){p.vy+=.05*dt;p.vx*=.985;p.l-=p.d*dt;fg.globalAlpha=Math.max(0,p.l);fg.fillStyle=p.c;fg.beginPath();fg.arc(p.x,p.y,2.5,0,TAU);fg.fill();if(p.l<=0)parts.splice(i,1)}
    else{p.r+=p.vr*dt;if(p.y>ch*.85)p.l-=.02*dt;fg.globalAlpha=Math.max(0,p.l);fg.fillStyle=p.c;fg.save();fg.translate(p.x,p.y);fg.rotate(p.r);fg.fillRect(-p.w/2,-p.w/4,p.w,p.w/2);fg.restore();if(p.y>ch+20||p.l<=0)parts.splice(i,1)}}
  fg.globalAlpha=1;
}
function frame(now){
  var dt=Math.min(3,(now-(last||now))/16.7);last=now;if(!t0)t0=now;
  var p=Math.min(1,(now-t0)/DUR);
  if(phase===0){
    var tgt=Math.min(STEPS,Math.floor(p*STEPS));for(;cnt<tgt;cnt++)tip(cnt/STEPS,trail,cnt*2);
    render(p,1,1,0,true);
    if(p>=1){phase=1;tf=now;celebrate(now)}
  }else if(phase===1){
    var f=Math.min(1,(now-tf)/2600),e=f*f*(3-2*f);render(1,1-e,1-e,e,false);
    if(f>=1){phase=2;render(1,0,0,1,false);timers.push(setTimeout(function(){photo.classList.add('on');cv.classList.add('dim')},2000))}
  }
  fxStep(now,dt);
  if(phase<2||parts.length||bursts.length)raf=requestAnimationFrame(frame);else{fg.clearRect(0,0,cw,ch);raf=0}
}
function start(){
  cancelAnimationFrame(raf);timers.forEach(clearTimeout);timers=[];size();
  trail=new Float32Array(STEPS*2);cnt=0;phase=0;t0=0;last=0;parts=[];bursts=[];
  msg.classList.remove("on");rp.classList.remove("on");photo.classList.remove("on");cv.classList.remove("dim");document.body.classList.remove("party");
  raf=requestAnimationFrame(frame);
}
rp.addEventListener("click",start);
var rt;window.addEventListener("resize",function(){clearTimeout(rt);rt=setTimeout(function(){size();if(phase===2)render(1,0,0,1,false)},120)});
var gate=document.getElementById('gate'),aud=null,sw=document.getElementById('sw');
if(VOICE_SRC){aud=new Audio();aud.preload='auto';aud.src=VOICE_SRC;
  sw.addEventListener('click',function(){aud.muted=!aud.muted;sw.setAttribute('aria-checked',String(!aud.muted))});
  aud.addEventListener('error',function(){aud=null;sw.style.display='none'});
  document.addEventListener('visibilitychange',function(){if(document.hidden&&aud)aud.pause()})}
function startShow(){
  /* drawing lasts as long as the voice note (between 40s and 2min); 55s without one */
  DUR=(aud&&aud.duration&&isFinite(aud.duration))?Math.min(120000,Math.max(40000,aud.duration*1000)):55000;
  start();
}
rp.removeEventListener("click",start);
rp.addEventListener("click",function(){if(aud){aud.currentTime=0;var q=aud.play();if(q&&q.catch)q.catch(function(){})}startShow()});
gate.addEventListener('click',function(){
  gate.classList.add('open');
  if(aud){sw.style.display='flex';var pr=aud.play();if(pr&&pr.catch)pr.catch(function(){})}
  setTimeout(function(){startShow();gate.classList.add('gone')},1500);
  setTimeout(function(){gate.style.display='none'},2800);
},{once:true});
size();
})();
</script></body></html>
